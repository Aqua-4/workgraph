database_path: activity.db
poll_interval_seconds: 5
idle_threshold_seconds: 300
session_gap_seconds: 90
browser_history_lookback_seconds: 600
log_path: logs/workgraph.log
identity_path: config/identity.json
dashboard_mode: standalone
break_reminders_enabled: true
break_work_minutes: 50
break_idle_minutes: 5
break_snooze_minutes: 10
time_announcements_enabled: true
time_announcement_interval_minutes: 30
time_announcement_active_only: true
# Local operating window in HH:MM; due prompts wait for the next opening.
wellbeing_start_time: "00:00"
wellbeing_end_time: "23:00"
# Enable the idle intent prompt (default: true).
idle_check_enabled: true
# Inactivity before prompting (minutes; default: 10).
idle_check_minutes: 10
# Delay after Still working or Snooze (minutes; default: 5).
idle_check_snooze_minutes: 5
# Enable scheduled movement prompts (default: true).
workout_reminders_enabled: true
# Elapsed-time interval, including meetings and reading (minutes; default: 90).
workout_interval_minutes: 90
# Delay before the next workout prompt (minutes; default: 15).
workout_snooze_minutes: 15
# Enable scheduled hydration prompts (default: true).
water_reminders_enabled: true
# Elapsed-time interval (minutes; default: 60).
water_interval_minutes: 60
# Delay before the next hydration prompt (minutes; default: 15).
water_snooze_minutes: 15
# Each exercise requires a positive reps count or duration_seconds value.
workout_exercises:
  - name: Push-ups
    reps: 10
  - name: Squats
    reps: 15
  - name: Jumping jacks
    duration_seconds: 30
  - name: Gyroball wrist workout
    duration_seconds: 60
sync_base_url: http://127.0.0.1:9000
sync_token: ""
sync_batch_size: 100
sync_pull_limit: 100
sync_max_pull_pages: 20
sync_timeout_seconds: 60
sync_interval_seconds: 7200
sync_backoff_base_seconds: 30
sync_backoff_max_seconds: 1800
