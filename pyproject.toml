[project]
name = "workgraph"
version = "0.1.0"
description = "Privacy-first local work telemetry for engineers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "psutil>=5.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "jinja2>=3.1",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
web = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
workgraph = "main:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
