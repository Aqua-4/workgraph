[project]
name = "workgraph"
version = "0.1.0"
description = "Privacy-first local work telemetry for engineers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
workgraph = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
