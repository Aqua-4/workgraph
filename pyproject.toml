[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workgraph"
version = "0.1.0"
description = "Privacy-first local work telemetry for engineers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "psutil>=5.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "jinja2>=3.1",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
web = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "httpx2>=0.27",
]

[project.scripts]
workgraph = "main:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["main"]
packages = ["api", "collector", "db", "processor", "services", "workgraph"]

[tool.setuptools.package-data]
api = ["templates/*.html", "static/**/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
